[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reelrank"
version = "0.1.0"
description = "Movie recommendations with learned embeddings, evaluated like a production ranking system."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[project.scripts]
reelrank = "reelrank.cli:main"

[tool.setuptools]
packages = ["reelrank"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.coverage.run]
source = ["reelrank"]
omit = ["reelrank/__main__.py"]
